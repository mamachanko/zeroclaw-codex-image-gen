[package]
name = "codex-image-gen"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generate images with a local Codex subscription through the Codex app-server"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
