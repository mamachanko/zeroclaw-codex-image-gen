[package]
name = "codex-image-gen"
version = "0.2.0-dev.1"
edition = "2021"
license = "MIT"
description = "Direct WASM image generation with host-managed Codex authentication"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.63"
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
