name = "codex-image-gen-prototype"
version = "0.0.0"
description = "Direct Codex image generation using proposed host auth and artifact services"
author = "mamachanko"
wasm_path = "codex_image_gen_prototype.wasm"
capabilities = ["tool"]
registry = false
permissions = ["http_client", "codex_auth", "artifact_write"]

[egress]
hosts = ["chatgpt.com"]
