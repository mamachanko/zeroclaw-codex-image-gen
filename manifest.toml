name = "codex-image-gen"
version = "0.2.0-dev.0"
description = "Direct Codex image generation using proposed host auth and artifact services"
author = "mamachanko"
wasm_path = "codex_image_gen.wasm"
capabilities = ["tool"]
# Development contract only: stock ZeroClaw does not implement these grants or
# the zeroclaw:proposed-image-services imports. Public releases are gated.
registry = false
permissions = ["http_client", "codex_auth", "artifact_write"]

[egress]
hosts = ["chatgpt.com"]
