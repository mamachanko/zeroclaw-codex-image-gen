name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified package
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify the tag matches the package version and belongs to main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib
          manifest = tomllib.loads(pathlib.Path('manifest.toml').read_text())
          expected = 'v' + manifest['version']
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Tag must match manifest version: {expected}')
          PY
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-image-gen-package
          path: dist
      - name: Verify package checksum
        working-directory: dist
        run: sha256sum --check ./*.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --generate-notes
